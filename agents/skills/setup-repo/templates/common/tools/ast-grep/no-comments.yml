---
id: no-comments-rust
language: Rust
severity: error
message: Carry the why in names, types and tests, a decision in an ADR, and a known hack in an issue.
rule:
  any: [{kind: line_comment}, {kind: block_comment}]
  not:
    any:
      - regex: '^(?://|/\*|#)\s*(?:prettier-ignore\b|SPDX-License-Identifier:|Copyright\s+(?:\(c\)\s*|©\s*)?\d{4}|https?://\S+\s*(?:\*/)?$)'
      - regex: '^//\s*SAFETY:'
      - follows:
          regex: '^//\s*SAFETY:'
          stopBy:
            not: {kind: line_comment}
      - regex: '^///\s*# Safety'
      - follows:
          regex: '^///\s*# Safety'
          stopBy:
            not: {kind: line_comment}
fix: ""
