id: no-comments-rust
language: Rust
severity: error
message: Carry the why in names, types and tests, a decision in an ADR, and a known hack in an issue.
rule:
  any: [{kind: line_comment}, {kind: block_comment}]
  not:
    any:
      - regex: '^(?:#!|(?://|/\*|#)\s*(?:SAFETY:|prettier-ignore|SPDX-License-Identifier:|Copyright\b|https?://\S+\s*(?:\*/)?$))'
      - follows:
          regex: '^//\s*SAFETY:'
          stopBy:
            not: {kind: line_comment}
fix: ""
