---
id: no-comments-typescript
language: TypeScript
severity: error
message: Carry the why in names, types and tests, a decision in an ADR, and a known hack in an issue.
rule:
  kind: comment
  not:
    any:
      - regex: '^(?://|/\*|#)\s*(?:prettier-ignore\b|SPDX-License-Identifier:|Copyright\s+(?:\(c\)\s*|©\s*)?\d{4}|https?://\S+\s*(?:\*/)?$)'
fix: ""
