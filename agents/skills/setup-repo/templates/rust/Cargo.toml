[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
as_conversions = "warn"
wildcard_enum_match_arm = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
let_underscore_must_use = "warn"
